services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 1s
      timeout: 3s
      retries: 60
    tmpfs:
      - /var/lib/postgresql/data

  migration:
    build:
      context: ${MEMLAYER_REPO_ROOT}
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: migration-test
      DATABASE_URL: ${DATABASE_URL}
      MEMLAYER_MIGRATION_DRILL: "1"
      MIGRATION_TARGET: ${MIGRATION_TARGET}
      MIGRATION_FIXTURE_PROFILE: ${MIGRATION_FIXTURE_PROFILE}
    command:
      - python
      - scripts/run_migration_profile.py
      - --target
      - ${MIGRATION_TARGET}
      - --fixture-profile
      - ${MIGRATION_FIXTURE_PROFILE}
